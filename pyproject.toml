[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-invest"
version = "0.1.0"
description = "Personal quantitative trading research platform with paper execution."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["quantitative-research", "paper-trading", "fastapi"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psutil>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
